name: PR Check

on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  # ── PR metadata validation (main only) ──────────────────────────────────────
  pr-metadata:
    name: Validate PR title & description
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title is not default
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          BLOCKED_TITLES="Staging|staging|Main|main|Update|update"
          if [ ${#PR_TITLE} -lt 10 ]; then
            echo "============================================================"
            echo "❌ PR TITLE TOO SHORT"
            echo "============================================================"
            echo ""
            echo "PR title must be at least 10 characters."
            echo "Current title: \"$PR_TITLE\" (${#PR_TITLE} chars)"
            echo ""
            echo "============================================================"
            exit 1
          fi

          if echo "$PR_TITLE" | grep -qxE "$BLOCKED_TITLES"; then
            echo "============================================================"
            echo "❌ PR TITLE REJECTED"
            echo "============================================================"
            echo ""
            echo "PR title cannot be a default value like \"Staging\"."
            echo "Use a descriptive title."
            echo ""
            echo "  Good: \"Fix trip card date formatting\""
            echo "  Good: \"Add damage report photo zoom\""
            echo "  Bad:  \"Staging\""
            echo ""
            echo "============================================================"
            exit 1
          fi

  # ── Release notes + App Store version gate (all target branches) ───────────
  # Every PR adds exactly one versions/<x.y.z>.md, newer than anything already
  # on the target branch, and bumps package.json to that same version — see
  # checkChangelog.ts. Runs on PRs into dev too: the bump has to land on the
  # way in, so a release never reaches main still carrying an approved version.
  changelog:
    name: Check release notes & version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Fetch target branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Check this PR adds release notes and bumps package.json to match
        run: npx tsx scripts/changelog/checkChangelog.cli.ts ${{ github.base_ref }}

      - name: Check the bundled notes are up to date
        run: npm run changelog:check

  # ── Code quality checks (all target branches) ──────────────────────────────
  check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Generate DB types from production
        run: supabase gen types typescript --project-id ${{ secrets.SUPABASE_PROJECT_ID }} > database.types.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: |
          if ! npx tsc --noEmit 2>&1; then
            echo ""
            echo "============================================================"
            echo "❌ TYPECHECK FAILED"
            echo "============================================================"
            echo ""
            echo "database.types.ts was regenerated from the PRODUCTION"
            echo "Supabase database before this check."
            echo ""
            echo "If you made schema changes locally (new tables, columns,"
            echo "altered types, etc.), those migrations must be pushed to"
            echo "production BEFORE this mobile app PR can pass."
            echo ""
            echo "1. Push your Supabase migrations to production first"
            echo "2. Then re-run this PR check"
            echo ""
            echo "============================================================"
            exit 1
          fi

      - name: Build check (iOS)
        run: npx expo export --platform ios

      - name: Build check (Android)
        run: npx expo export --platform android
