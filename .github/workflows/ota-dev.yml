name: OTA Update (dev)

on:
  push:
    branches: [dev]

jobs:
  ota:
    name: Publish OTA to development channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci --legacy-peer-deps

      - name: Publish OTA update
        run: eas update --channel development --message "${{ github.event.head_commit.message }}" --non-interactive
