name: Production Build

# Runs on every push to main (i.e. merged PRs).
# Always runs a full native build (iOS + Android) via EAS, then submits both
# straight to the stores — no manual step:
#   - iOS lands in App Store Connect. Apple review still has to be kicked off
#     there by hand; this does not publish to the public App Store on its own.
#   - Android is pushed to the Play Console "production" track at 100% rollout
#     (eas.json submit.production.android) — this DOES go live to real users
#     with no human step. Every merge to main ships to Android users directly.
#
# To resubmit an existing build by hand instead (e.g. this job failed after
# building but before submitting), use the separate Store Submit workflow.

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Typecheck, Lint, Build & Submit
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci --legacy-peer-deps

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Generate DB types from production
        run: supabase gen types typescript --project-id ${{ secrets.SUPABASE_PROJECT_ID }} > database.types.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build iOS
        run: eas build --profile production --platform ios --non-interactive

      - name: Build Android
        run: eas build --profile production --platform android --non-interactive

      # `eas build` above blocks until each build finishes, so `--latest` here
      # is unambiguously the build this run just produced.
      - name: Submit iOS to App Store Connect
        run: eas submit --profile production --platform ios --latest --non-interactive

      - name: Submit Android to Google Play (production track, live)
        run: eas submit --profile production --platform android --latest --non-interactive
